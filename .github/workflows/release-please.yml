# release-please:merge 進 main 時,依 conventional commit 自動為「版本有變更」的 plugin
# 收進「一個」Release PR(更新各 plugin 的 plugin.json version + CHANGELOG);merge 那個 PR 即發版,
# 並為每個 plugin 各打一個 tag。各 plugin 的版本仍獨立計算,只是共用一條 release 分支——分開開的話
# `.release-please-manifest.json` 那幾行相鄰的版本號會讓任兩個 Release PR 互相衝突,而 release-please
# 不會把既有的 Release PR 分支 rebase 到新的 main(實測),所以每次發版都要重解同樣的衝突。
#
# 設定檔(repo 根,自動偵測):
#   - release-please-config.json     四個 plugin 各自一個 component、版本寫進各自 plugin.json
#   - .release-please-manifest.json  記錄每個 plugin 現在的版本(初始全 0.1.0)
#
# ── tag 名稱格式:`<plugin>--v<version>`(兩個減號)────────────────────────────
# 這不是隨便選的:Claude Code 解析 plugin 相依的版本約束時,是去 marketplace repo 列
# tag、篩出開頭為 `<plugin-name>--v` 的那些,再取滿足 semver range 的最高版。用單一減號
# 的話一個都篩不到,帶約束的相依會直接讓依賴方被停用(no-matching-tag)。所以
# release-please-config.json 的 `tag-separator` 必須是 `--`,才跟官方 `claude plugin tag`
# 產生的 tag 同名。
#
# ── 首次啟用(這條 branch merge 進 main 後做一次)──────────────────────────────
# 初版 0.1.0 是手寫的;為了讓 release-please「忽略 0.1.0 之前的所有歷史」(含已拆掉的
# 單體 turbo-plugin 幽靈 commit),merge 後在 merge commit 上替五個 component 各打一個
# 0.1.0 tag,release-please 會以此為基準、只處理之後的 commit:
#
#   M=$(git rev-parse origin/main)
#   for p in turbo-plugin-code-comment turbo-plugin-dotnet-framework \
#            turbo-plugin-git-svn turbo-plugin-three-environment-db \
#            turbo-plugin-multi-repo-workspace; do
#     git tag "$p--v0.1.0" "$M"
#   done
#   git push origin --tags
#
# 之後每次 push 進 main,本 workflow 自動跑。

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 為什麼不用 secrets.GITHUB_TOKEN(2026-08-07 實測後改的)
      #
      # 用它開出來的 Release PR,其 workflow run 的 actor 是 `github-actions[bot]`,而 2026-06-11
      # 起 GitHub 對 bot 身分發動的 run 一律要人工核准(changelog: "Bot-created pull requests can
      # run workflows if approved")。結果是 Release PR 上的 `tests-passed` /
      # `review-with-tracking` 這兩個必要 check 永遠不會出現,PR 卡在 BLOCKED 無法 merge——
      # 每次發版都要有人進 Actions 頁面按核准。release-please 官方 README 對此的建議原文是:
      # "You will want to configure a GitHub Actions secret with a Personal Access Token if you
      # want GitHub Actions CI checks to run on Release Please PRs."
      #
      # 這裡選 GitHub App 而不是 PAT,唯一理由是 PAT 會過期(fine-grained 上限一年),到期時
      # 這支 workflow 會以一個裸的 401 紅掉,而那時候沒有人記得今天查過什麼。App token 是每次
      # 執行現場產生、有效期以小時計,沒有任何需要定期處理的事。
      #
      # 代價是 actor 變成 `<app-slug>[bot]`,仍然是 bot 身分,所以 claude-code-action 那道
      # `allowed_bots` 閘要另外開——見 pr-review-comprehensive.yml 的對應註解。
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          # config-file / manifest-file 預設就是 release-please-config.json
          # 與 .release-please-manifest.json,放在 repo 根即自動採用。
          token: ${{ steps.app-token.outputs.token }}
