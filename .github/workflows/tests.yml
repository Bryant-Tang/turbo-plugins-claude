name: Script Tests

# Convention-based auto-discovery (KTD6 / R7): any plugin that ships the standard
# tests/ entrypoint is discovered automatically. Adding a new plugin that follows
# the layout needs NO change to this workflow.
#
# v0.5.0 (U18): the suite runs on Pester 5 (.ps1) + vendored shUnit2 (.sh).
#   - test-windows: ONE orchestrator (Invoke-ScriptTests.ps1, Windows PowerShell 5.1)
#     runs .ps1 via Pester and .sh via shUnit2 (git-bash present on windows runners).
#   - test-ubuntu: TWO orchestrators — the bash orchestrator runs the .sh suite via the
#     vendored shUnit2, and a pwsh step runs the PowerShell orchestrator for the .ps1 suite
#     (with -SkipPreflight, since the lint pre-flight hardcodes Windows powershell.exe). The
#     PS orchestrator does NOT resolve bash on non-Windows, so .sh never double-runs.
#   Framework missing (Pester 5 absent / vendored shUnit2 absent) = the job FAILs (R20);
#   only Unix x Windows-only-tool cases self-SKIP.
# TRIGGERS: `main` on push, everything else via its pull request. This is the ordinary shape, and
# it is here because the two alternatives were built and measured and both failed (issue #90).
#
# The problem it solves: with `push` on every branch, a commit on a PR branch ran the whole matrix
# TWICE -- once as a push, once as a pull_request. ~28 minutes each, so ~55 minutes of runner time
# for one commit's worth of information.
#
# Why not collapse the two runs instead. Both attempts foundered on the same GitHub rule, that
# EVERY check-run on a SHA counts, not just the newest:
#   * a shared `concurrency` group (PR #93) does cancel one side, but the cancelled run leaves a
#     FAILURE `tests-passed` on that SHA, and the PR is then permanently BLOCKED;
#   * skipping the redundant push run's jobs (PR #94) leaves a SKIPPED `tests-passed` -- and a
#     skipped required check counts as SATISFIED. Worse than blocking: a dependent job creates no
#     check-run until it starts, so for the ~28 minutes the real matrix is running there is no
#     pending `tests-passed` to hold the door, and the PR reads as mergeable WHILE UNTESTED.
# There is no third way as long as this workflow contains a job named `tests-passed`: skipped or
# cancelled, that name always produces a check-run, and both readings are wrong.
#
# WHAT THIS GIVES UP, and what replaces it. A branch with no pull request now gets no CI at all.
# That gap is real -- feat/turbo-plugin once ran hundreds of commits with no run, and a shared-copy
# invariant stayed broken because the only thing that checks it never executed. The replacement is
# a convention, written down in CLAUDE.md: OPEN A DRAFT PR AS SOON AS YOU CREATE THE BRANCH. Draft
# pull requests fire `pull_request` events normally (this workflow filters no `types`), so a draft
# gets the full matrix from its first commit.
#
# The residual risk is bounded in a way the old gap was not: a branch has to have a PR to be
# merged, so the worst case is late feedback rather than none. That was in fact the cost of the
# feat/turbo-plugin incident too -- the invariant was caught when the PR opened, just far too late.
#
# This also deletes a workaround rather than adding one. `branches-ignore: release-please--**` used
# to be needed because release-please creates its branch pointing at main's HEAD, so that first
# push fired a run whose `github.sha` IS main's, and cancelling it left a FAILURE `tests-passed` on
# main's own commit (measured on 12eb846: four `tests-passed` check-runs on one SHA). With push
# limited to main, release-please's branch pushes do not trigger this workflow at all.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch under active development gets many pushes in a row, and only the newest commit's result
# is interesting, so supersede the older runs instead of paying for all of them. The default branch
# is excluded from cancellation so a merge to main always gets a complete recorded result.
#
# Grouping by `github.ref` is right for what is left after the trigger change above: a PR branch
# now produces only pull_request runs, which all share `refs/pull/<n>/merge`, so a new commit
# supersedes the previous one exactly as intended. It no longer has to reconcile two events.
concurrency:
  group: script-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # ── discover ────────────────────────────────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
      affected: ${{ steps.affected.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Discover plugins with a standard test entrypoint
        id: set
        shell: bash
        run: |
          set -euo pipefail
          plugins=()
          for dir in plugins/*/tests/; do
            [ -d "$dir" ] || continue
            plugin="${dir%/tests/}"
            if [ -f "${dir}Invoke-ScriptTests.ps1" ] || [ -f "${dir}invoke-script-tests.sh" ]; then
              plugins+=("$plugin")
            fi
          done
          json='{"plugin":['
          first=1
          for p in "${plugins[@]+"${plugins[@]}"}"; do
            if [ $first -eq 1 ]; then first=0; else json="${json},"; fi
            json="${json}\"${p}\""
          done
          json="${json}]}"
          echo "Discovered ${#plugins[@]} plugin(s): ${plugins[*]+"${plugins[*]}"}"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "count=${#plugins[@]}" >> "$GITHUB_OUTPUT"

      # ── Which plugins did this change actually touch? ───────────────────────
      # The windows git-svn leg alone takes ~20 minutes (it builds real SVN repositories); every
      # other leg finishes inside 5. So a docs-only PR, or one touching a single plugin, spent 25
      # minutes waiting on suites that could not possibly be affected -- and every `Update branch`
      # or conflict fix paid it again.
      #
      # This emits the list of plugins worth testing. The matrix itself is NOT filtered: a leg that
      # disappears from the matrix would make the aggregated job result `skipped`, which
      # `tests-passed` deliberately treats as failure. Instead every leg still runs and reports
      # success -- the untouched ones just exit early inside the job.
      #
      # The answer can also be `NONE`: every changed path is on the classifier's inert list (root
      # prose, release-please state, a plugin's release-managed CHANGELOG.md / plugin.json), so no
      # plugin suite can be affected and every leg exits early. That is what makes a Release PR --
      # a diff containing no code at all -- stop costing a full matrix run. It is a distinct word
      # rather than empty output because empty already means "the classifier did not run", which
      # must keep failing open to ALL; see tools/affected-plugins.sh for the full argument, and
      # note that verify-core-identical and tools-tests have no `needs: discover` and run anyway.
      #
      # FAILURE MODE IS "RUN EVERYTHING". Emitting ALL is the answer whenever anything is unclear:
      # the compare API failed, this is a first push with no base, or a changed file lives outside
      # plugins/ (tools/, .github/, root config -- any of which can affect every plugin). Getting
      # this wrong in the other direction means silently not testing something, and this repo has
      # been bitten by "quiet enough to look green" before.
      #
      # This step owns only what needs event/API context: resolving base..head, calling compare,
      # and noticing a possibly-truncated response. The path CLASSIFICATION lives in
      # tools/affected-plugins.sh so it can be tested (tools/tests/, run by the `tools-tests` job).
      # It is called, NOT copied: a second copy of the branching would drift from this one and the
      # tests would keep passing against the copy nobody runs.
      - name: Compute affected plugins
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          base=''
          head=''
          case "${{ github.event_name }}" in
            pull_request)
              base='${{ github.event.pull_request.base.sha }}'
              head='${{ github.event.pull_request.head.sha }}'
              ;;
            push)
              base='${{ github.event.before }}'
              head='${{ github.sha }}'
              # All-zero `before` means a branch's first push: there is no base to compare against.
              case "$base" in *[!0]*) ;; *) base='' ;; esac
              ;;
          esac

          if [ -z "$base" ] || [ -z "$head" ]; then
            echo 'No usable base for comparison; testing every plugin.'
            echo 'list=ALL' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resp="$(gh api "repos/${{ github.repository }}/compare/${base}...${head}" 2>/dev/null)"
          if [ -z "$resp" ]; then
            echo 'Could not read the changed-file list; testing every plugin.'
            echo 'list=ALL' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The compare API caps `files` at 300 entries and does NOT flag that it truncated. A
          # change big enough to hit the cap would silently look like "only these 300 files
          # changed", and anything past the cap would go untested. Treat a full page as "unknown".
          n="$(printf '%s' "$resp" | jq '.files | length' 2>/dev/null)"
          if [ -z "$n" ] || [ "$n" -ge 300 ]; then
            echo "Changed-file list is missing or may be truncated (${n:-?} entries); testing every plugin."
            echo 'list=ALL' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Take previous_filename too, not just filename: a file MOVED from one plugin to another
          # changes both plugins, but `.filename` only names the destination. Without the old path
          # the source plugin -- the one that just lost a file -- would not be tested.
          files="$(printf '%s' "$resp" | jq -r '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null)"
          if [ -z "$files" ]; then
            echo 'Changed-file list parsed empty; testing every plugin.'
            echo 'list=ALL' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `env -u GH_TOKEN`: this step is the only one in the workflow that both holds a token
          # and runs a file out of the checkout (on a pull_request the workflow comes from the
          # base branch, but the checked-out tree is the PR's). The classifier is a pure text
          # function and has no use for a token, so do not hand it one. The other test jobs run
          # checked-out code too, and none of them sets GH_TOKEN -- this keeps that property.
          touched="$(printf '%s\n' "$files" | env -u GH_TOKEN bash tools/affected-plugins.sh)"
          rc=$?
          # The classifier answers ALL for anything it cannot attribute, so a non-zero exit means
          # it did not run at all (missing file, unreadable, bad invocation) -- not "no plugins".
          # Taking its empty output at face value there would skip every suite.
          if [ "$rc" -ne 0 ] || [ -z "$touched" ]; then
            echo "tools/affected-plugins.sh did not produce a result (exit ${rc}); testing every plugin."
            echo 'list=ALL' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$touched" = 'NONE' ]; then
            echo 'Affected plugin(s): none -- every changed path is non-behavioural (reasons above).'
          else
            echo "Affected plugin(s): ${touched}"
          fi
          echo "list=${touched}" >> "$GITHUB_OUTPUT"

  # ── test-windows ────────────────────────────────────────────────────────────
  # Windows PowerShell 5.1 (powershell.exe) runs the ONE orchestrator, which covers
  # BOTH .ps1 (Pester 5) and .sh (vendored shUnit2 via git-bash). Pester 5 is installed
  # side-by-side with the WinPS-builtin 3.4; shUnit2 is vendored (no install).
  test-windows:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Early-exit gate (see "Compute affected plugins" in `discover`). The job still RUNS and still
      # reports success -- it just does nothing when this plugin was not touched. Skipping the job
      # itself would make the aggregated matrix result `skipped`, which `tests-passed` counts as a
      # failure on purpose.
      - name: Is this plugin affected?
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          affected='${{ needs.discover.outputs.affected }}'
          if [ "$affected" = 'ALL' ] || [ -z "$affected" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NONE would fall through the membership test below to the same answer, but only by
          # accident -- and "correct for a reason nobody wrote down" is how a later edit breaks it.
          # It is also the one answer that skips EVERY leg, so it deserves to say so in the log
          # rather than appear as N identical "untouched" notices.
          if [ "$affected" = 'NONE' ]; then
            echo "::notice::this change is entirely non-behavioural (see the classifier's reasons in the discover job); no plugin suite can be affected."
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case " $affected " in
            *" ${{ matrix.plugin }} "*)
              echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::${{ matrix.plugin }} untouched by this change; skipping its suite."
              echo 'run=false' >> "$GITHUB_OUTPUT" ;;
          esac

      # Does THIS plugin need svn at all? The gate above answers "was it touched", which is a
      # different question -- and answering only that made every plugin pay for an install it does
      # not use. See tools/plugin-requires-tool.sh for why the answer lives in the plugin.
      - name: Does this plugin need Subversion?
        id: needs
        shell: bash
        run: echo "svn=$(bash tools/plugin-requires-tool.sh '${{ matrix.plugin }}' svn)" >> "$GITHUB_OUTPUT"

      # `sliksvn`, NOT the `svn` package. Chocolatey's `svn` is win32svn, last published in 2015 and
      # pinned at Subversion 1.8.15 -- which predates `svn info --show-item` (added in 1.9). These
      # scripts use --show-item in a dozen places, so with that package the suite runs and fails 40
      # cases with "invalid option: --show-item", which looks like a product bug and is not one.
      # sliksvn tracks the 1.14 LTS line, the same one TortoiseSVN ships.
      #
      # The install itself, and the retrying around it, live in `tools/install-svn.sh` -- both legs
      # call that one file. It is not inlined here because a retry loop that quietly retries zero
      # times behaves exactly like one that works on every run where the network is fine, and the
      # only signal on the runs where it is not is a human noticing. The script's tests pin the
      # retry count for that reason.
      #
      # This leg has failed for real: 2026-08-21, the choco community feed answered
      # `503 (Service Unavailable)` and `Chocolatey installed 0/0 packages`. Unlike the apt hang on
      # the ubuntu twin that failure was FAST, so retrying is the entire fix here.
      - name: Install Subversion
        if: steps.gate.outputs.run != 'false' && steps.needs.outputs.svn == 'true'
        shell: bash
        run: bash tools/install-svn.sh
        # Both together, on purpose: continue-on-error alone still lets a wedged package manager
        # hold the job to the 6-hour default. The timeout turns "stuck" into "absent", and
        # continue-on-error turns "absent" into SKIPped svn tests instead of a dead job.
        # Retrying does not replace either one -- it only removes the manual rerun in the common case.
        timeout-minutes: 10
        continue-on-error: true

      # choco updates the machine PATH, but a step's environment is captured when the step starts,
      # so later steps in the SAME job never saw svn. Append the install dir to GITHUB_PATH so the
      # following steps really can run svn.
      #
      # Do NOT guess the install directory. The previous version of this step listed
      # "C:\Program Files\Subversion\bin" and the choco `svn` package (win32svn) installs to
      # "C:\Program Files (x86)\Subversion\bin" -- a one-token miss that cost 96 svn-gated Pester
      # cases in the git-svn suite, silently, for as long as this step has existed: the install
      # succeeded, the probe found nothing, the cases self-SKIPped and the job stayed green. choco
      # itself prints the directory it added to the machine PATH, so read PATH back out of the
      # registry and let `Get-Command` answer. The hardcoded list survives only as a fallback for a
      # provider that does not touch PATH at all.
      - name: Put Subversion on PATH for later steps
        if: steps.gate.outputs.run != 'false' && steps.needs.outputs.svn == 'true'
        shell: pwsh
        run: |
          # This step now runs ONLY for a plugin that declared svn, so a missing or too-old svn is
          # never a degraded run here -- it is no run at all, and the cases would self-SKIP into a
          # green job that tested nothing. Fail loudly.
          #
          # The plugin name used to be hardcoded here (`EndsWith('turbo-plugin-git-svn')`), which
          # is the same maintenance trap the declaration file exists to remove: a second plugin
          # needing svn would have been silently downgraded to a warning.
          function Complain([string]$message) {
            Write-Host "::error::$message"
            exit 1
          }

          $env:Path = @(
            [System.Environment]::GetEnvironmentVariable('Path', 'Machine'),
            [System.Environment]::GetEnvironmentVariable('Path', 'User')
          ) -join ';'

          $svnPath = ''
          $cmd = Get-Command svn.exe -ErrorAction SilentlyContinue
          if ($cmd) { $svnPath = @($cmd)[0].Source }

          if (-not $svnPath) {
            foreach ($c in @(
              'C:\Program Files (x86)\Subversion\bin',
              'C:\Program Files\Subversion\bin',
              'C:\Program Files\SlikSvn\bin',
              'C:\Program Files\TortoiseSVN\bin'
            )) {
              $candidate = Join-Path $c 'svn.exe'
              if (Test-Path -LiteralPath $candidate) { $svnPath = $candidate; break }
            }
          }

          if ($svnPath) {
            $dir = Split-Path -Parent $svnPath
            # Running it is the assertion; a file existing at that path is not the same as a usable
            # svn (wrong architecture, missing runtime, broken install all pass Test-Path).
            $version = (& $svnPath --version --quiet)
            Write-Host "svn $version found at $dir"

            # Same reasoning as the Pester 5.x pin below: a green run on the wrong tool version is
            # worse than a red one. `svn info --show-item` arrived in 1.9 and these scripts depend
            # on it throughout, so anything older cannot exercise them -- it just fails every case
            # with "invalid option" and buries the real signal.
            $MIN_SVN = [version]'1.9'
            $parsed = $null
            if (-not [version]::TryParse(($version -replace '[^0-9.].*$', ''), [ref]$parsed)) {
              Write-Host "::warning::could not parse svn version '$version'; continuing."
            } elseif ($parsed -lt $MIN_SVN) {
              Complain "svn $version is older than the required $MIN_SVN (svn info --show-item arrived in 1.9)."
            }

            Add-Content -Path $env:GITHUB_PATH -Value $dir
            exit 0
          }

          Complain 'svn.exe not found after `choco install sliksvn`.'

      - name: Configure git identity (defensive)
        if: steps.gate.outputs.run != 'false'
        shell: bash
        run: |
          git config --global user.email "ci@turbo-plugin"
          git config --global user.name "turbo-plugin-ci"

      - name: Install Pester 5 (Windows PowerShell 5.1)
        if: steps.gate.outputs.run != 'false'
        shell: powershell
        run: |
          # Pin to the Pester 5 line. `-MinimumVersion 5.0` means "at least 5.0", so it installed
          # whatever was newest -- which is now Pester 6.0.1, a different major with breaking
          # changes. CI was therefore running these tests on a framework nobody had ever run them
          # on locally (5.7.1), and the mismatch showed up as test failures that reproduce nowhere
          # else. `-MaximumVersion 5.99.99` keeps CI and local on the same major; moving to Pester 6
          # should be a deliberate change with the tests migrated, not something a release picks up.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber

      - name: Run orchestrator (Windows PowerShell 5.1; .ps1 Pester + .sh shUnit2)
        if: steps.gate.outputs.run != 'false'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ${{ matrix.plugin }}/tests/Invoke-ScriptTests.ps1

  # ── test-ubuntu ─────────────────────────────────────────────────────────────
  # Two orchestrators: bash (shUnit2 .sh) + pwsh (Pester .ps1, -SkipPreflight). The .sh
  # ps1-delegate / .NET / IIS cases self-SKIP on a runner without those tools; the SVN/git
  # cases RUN. Pester 5 is installed for pwsh; shUnit2 is vendored.
  test-ubuntu:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Same early-exit gate as test-windows; see "Compute affected plugins" in `discover`.
      - name: Is this plugin affected?
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          affected='${{ needs.discover.outputs.affected }}'
          if [ "$affected" = 'ALL' ] || [ -z "$affected" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NONE would fall through the membership test below to the same answer, but only by
          # accident -- and "correct for a reason nobody wrote down" is how a later edit breaks it.
          # It is also the one answer that skips EVERY leg, so it deserves to say so in the log
          # rather than appear as N identical "untouched" notices.
          if [ "$affected" = 'NONE' ]; then
            echo "::notice::this change is entirely non-behavioural (see the classifier's reasons in the discover job); no plugin suite can be affected."
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case " $affected " in
            *" ${{ matrix.plugin }} "*)
              echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::${{ matrix.plugin }} untouched by this change; skipping its suite."
              echo 'run=false' >> "$GITHUB_OUTPUT" ;;
          esac

      # Same question, same answer source as the windows leg: the plugin says whether it needs svn.
      - name: Does this plugin need Subversion?
        id: needs
        run: echo "svn=$(bash tools/plugin-requires-tool.sh '${{ matrix.plugin }}' svn)" >> "$GITHUB_OUTPUT"

      # This step is where 2026-08-18 went wrong: apt wedged on the runner and the job sat there
      # for 49 minutes with every later step pending, while the SAME commit's other run passed.
      # It had neither a timeout nor continue-on-error, so nothing bounded it -- the windows twin
      # had continue-on-error and this one had never been brought in line. Both are needed:
      # continue-on-error alone would still have let it run to the 6-hour default.
      #
      # The retry that keeps this from costing a manual rerun every time lives in
      # `tools/install-svn.sh`, shared with the windows leg. The part that matters for THIS leg is
      # that a retry loop alone would have been useless: apt hangs rather than returning, so the
      # loop never reaches its second iteration. The script passes `Acquire::*::Timeout`, which is
      # what turns the hang into a quick failure that can then be retried.
      - name: Install Subversion
        if: steps.gate.outputs.run != 'false' && steps.needs.outputs.svn == 'true'
        shell: bash
        run: bash tools/install-svn.sh
        timeout-minutes: 10
        continue-on-error: true

      # A plugin that DECLARED svn and then did not get it would run its suite as green SKIPs --
      # tested nothing, said success. The install above is allowed to fail; this is where that
      # failure has to become visible instead.
      - name: Verify Subversion is usable
        if: steps.gate.outputs.run != 'false' && steps.needs.outputs.svn == 'true'
        run: |
          if ! command -v svn >/dev/null 2>&1; then
            echo "::error::${{ matrix.plugin }} declares svn but it is not installed; its svn-dependent cases would all SKIP."
            exit 1
          fi
          svn --version --quiet

      - name: Configure git identity (defensive)
        if: steps.gate.outputs.run != 'false'
        run: |
          git config --global user.email "ci@turbo-plugin"
          git config --global user.name "turbo-plugin-ci"

      - name: Run bash orchestrator (shUnit2 .sh suite)
        if: steps.gate.outputs.run != 'false'
        shell: bash
        run: |
          set -o pipefail
          bash ${{ matrix.plugin }}/tests/invoke-script-tests.sh 2>&1 | tee orchestrator-output.txt

      - name: Install Pester 5 (pwsh)
        if: steps.gate.outputs.run != 'false'
        shell: pwsh
        run: |
          # Pin to the Pester 5 line. `-MinimumVersion 5.0` means "at least 5.0", so it installed
          # whatever was newest -- which is now Pester 6.0.1, a different major with breaking
          # changes. CI was therefore running these tests on a framework nobody had ever run them
          # on locally (5.7.1), and the mismatch showed up as test failures that reproduce nowhere
          # else. `-MaximumVersion 5.99.99` keeps CI and local on the same major; moving to Pester 6
          # should be a deliberate change with the tests migrated, not something a release picks up.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run PowerShell orchestrator (pwsh; .ps1 Pester only, -SkipPreflight)
        if: steps.gate.outputs.run != 'false'
        shell: pwsh
        run: |
          # -SkipPreflight: the lint pre-flight invokes Windows powershell.exe (a PS 5.1 /
          # Windows concern already covered by the windows job). The framework gate + fixture
          # handling still run, so Pester 5 absence still FAILs here. BashPath does not resolve
          # on non-Windows, so the .sh suite SKIPs in this step (owned by the bash orchestrator).
          ./${{ matrix.plugin }}/tests/Invoke-ScriptTests.ps1 -SkipPreflight

      - name: SKIP visibility (R20)
        if: ${{ always() }}
        shell: bash
        run: |
          # The .sh orchestrator's tool-incompatible cases self-SKIP via shUnit2 startSkipping.
          # Surface the count so SKIP is distinguishable from PASS in the log. Non-fatal.
          if [ -f orchestrator-output.txt ]; then
            n=$(grep -c -i "skip" orchestrator-output.txt || true)
            echo "Lines mentioning skip on ubuntu: ${n}"
          else
            echo "No bash orchestrator output captured."
          fi

  # ── verify-core-identical (cross-plugin consistency, U8 / KTD3) ──────────────
  # Repo-level invariant the per-plugin orchestrators cannot check: files copied
  # byte-identical into multiple plugins (universal Core.{ps1,sh} + shared tp-setup
  # base assets) must not drift, and marketplace.json must stay installable. Runs the
  # locale-safe bash tool (the .ps1 sibling is for local Windows use). Independent of
  # plugin discovery — always runs. This is the ONE workflow job that adding a plugin
  # may need to be aware of (R21 exception); the tool auto-discovers copies, so no edit
  # is needed per plugin.
  verify-core-identical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify cross-plugin shared-copy consistency + marketplace installability
        shell: bash
        run: bash tools/verify-core-identical.sh

  # ── tools-tests (repo-level tools/, NOT a plugin) ───────────────────────────
  # tools/ sits outside plugins/, so the convention-based discovery above never sees it and the
  # affected-plugins gate never applies (a change under tools/ makes every plugin affected
  # anyway). It gets its own job, and that job is in `tests-passed`'s needs -- a suite nothing
  # depends on is a suite that can stop running unnoticed.
  #
  # ubuntu only, deliberately: what these tests cover is bash consumed by GitHub Actions
  # `shell: bash`, and that is where it runs. Add a windows leg when something under tools/ has
  # behaviour that differs there.
  tools-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run tools orchestrator (shUnit2)
        shell: bash
        run: bash tools/tests/invoke-script-tests.sh

  # ── inert-files-are-inert ───────────────────────────────────────────────────
  # The experiment behind `affected-plugins.sh` being allowed to answer NONE. That answer rests on
  # a claim about this repository -- nothing depends on the CONTENT of the inert files -- and until
  # now the only thing behind that claim was a grep over test source, which guesses how people
  # write reads. This replaces the code inspection with the experiment itself: garble the contents,
  # run the suites, see whether anything notices. See tools/verify-inert-files.sh.
  #
  # No `needs: discover` and no affected-plugins gate, deliberately. The claim is about the repo,
  # not about this diff -- and a Release-PR-shaped diff, the exact case NONE exists to make cheap,
  # is precisely when this still has to run.
  #
  # ubuntu only. The issue behind this measured the alternative: the windows git-svn leg alone is
  # 28 minutes, against about two for the whole ubuntu half. Every `.sh` suite already runs here,
  # so the windows half would multiply the cost of the workflow for a small gain.
  #
  # THE HONEST RESIDUAL GAP: cases that self-SKIP on ubuntu (no .NET, no IIS) never execute, and
  # code that never runs cannot read anything. A read that happens only inside a Windows-only case
  # stays invisible. That gap is much smaller than grep's and points the same way -- "did not
  # look", rather than "looked and got it wrong". Nothing can close it completely: the tests are
  # arbitrary programs.
  inert-files-are-inert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Best-effort, and deliberately NOT followed by the fail-loud verify the matrix legs use.
      # Without svn the git-svn suite self-SKIPs its svn cases, which narrows what this experiment
      # covers but does not make its answer wrong -- and `test-ubuntu (plugins/turbo-plugin-git-svn)`
      # already turns a missing svn into a red job on this same commit. One loud guard is enough;
      # a second one here would only add another way for infrastructure to fail this check.
      - name: Install Subversion (best effort — degrades coverage, never fails this job)
        shell: bash
        run: bash tools/install-svn.sh
        timeout-minutes: 10
        continue-on-error: true

      # Defensive, exactly like the identical step in test-ubuntu and test-windows -- and NOT
      # because a suite needs it today: every fixture that commits sets its own local
      # user.email/user.name, which is why this job was green before this step existed. It is here
      # for symmetry. This job runs EVERY suite rather than one matrix leg's, so a future test that
      # leans on a global identity would fail here first, and it would fail with a message about
      # git rather than about inert files -- the most confusing possible place to learn about it.
      - name: Configure git identity (defensive)
        shell: bash
        run: |
          git config --global user.email "ci@turbo-plugin"
          git config --global user.name "turbo-plugin-ci"

      - name: Garble the inert files and run every suite
        shell: bash
        run: bash tools/verify-inert-files.sh

  commit-messages-parseable:
    # release-please decides CHANGELOG content with @conventional-commits/parser, a STRICT PEG
    # grammar. A message it cannot parse is logged once and skipped -- no error, no warning, no
    # CHANGELOG entry, and no contribution to the version bump. 11 commits in this repo's history
    # lost their bullet that way before anyone noticed (issue #141). Nothing local catches it:
    # commitlint and friends use the LENIENT regex parser, which accepts the same message happily.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check needs the base commit to compute a range, so the default shallow clone
          # will not do.
          fetch-depth: 0

      # Pinned, and pinned to what release-please actually resolves. A different version could
      # disagree about what parses, which would make this check answer a question nobody asked.
      - name: Install the parser release-please uses (pinned)
        shell: bash
        run: npm install --no-save @conventional-commits/parser@0.4.1

      # Two conditional STEPS rather than a conditional job: a skipped JOB fails `tests-passed` by
      # design, so this job must always run and report.
      - name: Check the pull request's commits
        if: github.event_name == 'pull_request'
        shell: bash
        run: bash tools/check-commit-parseable.sh "${{ github.event.pull_request.base.sha }}..HEAD"

      # --allow-empty here only: a push can legitimately carry no non-merge commits, whereas a pull
      # request always has at least one, so an empty range there means the range itself is wrong.
      - name: Check the pushed commits
        if: github.event_name == 'push'
        shell: bash
        run: bash tools/check-commit-parseable.sh --allow-empty "${{ github.event.before }}..${{ github.sha }}"

  # ── tests-passed ────────────────────────────────────────────────────────────
  # The ONE check branch protection should point at. Its whole purpose is to have a name that never
  # changes.
  #
  # Do NOT make the per-plugin matrix jobs required checks directly. The matrix is generated by
  # `discover` (that is what makes "add a plugin, edit no workflow" work), so the job names --
  # `test-windows (plugins/turbo-plugin-foo)` -- move whenever a plugin is added, removed or
  # renamed. Required checks are matched by NAME, so pinning them breaks in two directions:
  #
  #   * a sixth plugin gets NO gate, because its generated name is not in the required list, and
  #     nothing announces that;
  #   * a removed or renamed plugin leaves a required check that will never report again, which
  #     blocks every future PR with no way to satisfy it.
  #
  # This job depends on the matrix jobs as a whole instead. A matrix job's aggregated result is
  # `success` only when EVERY leg succeeded, so one dependency covers all plugins without naming
  # any of them.
  tests-passed:
    # Without always(), this job is SKIPPED when an upstream job fails -- so it would stop
    # reporting at exactly the moment it matters, and a skipped required check never turns red.
    if: always()
    needs: [discover, verify-core-identical, tools-tests, inert-files-are-inert, commit-messages-parseable, test-ubuntu, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every test job succeeded
        shell: bash
        env:
          DISCOVER: ${{ needs.discover.result }}
          CORE: ${{ needs.verify-core-identical.result }}
          TOOLS: ${{ needs.tools-tests.result }}
          INERT: ${{ needs.inert-files-are-inert.result }}
          COMMITMSG: ${{ needs.commit-messages-parseable.result }}
          UBUNTU: ${{ needs.test-ubuntu.result }}
          WINDOWS: ${{ needs.test-windows.result }}
        run: |
          echo "discover:              $DISCOVER"
          echo "verify-core-identical: $CORE"
          echo "tools-tests:           $TOOLS"
          echo "inert-files-are-inert: $INERT"
          echo "commit-msgs-parseable: $COMMITMSG"
          echo "test-ubuntu:           $UBUNTU"
          echo "test-windows:          $WINDOWS"
          # `skipped` and `cancelled` fail here too, on purpose: a test job that did not run is not
          # evidence that anything passed. This repo has already been bitten by "quiet enough to
          # look green" more than once.
          failed=0
          for r in "$DISCOVER" "$CORE" "$TOOLS" "$INERT" "$COMMITMSG" "$UBUNTU" "$WINDOWS"; do
            if [ "$r" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more test jobs did not succeed"
            exit 1
          fi
          echo "All test jobs succeeded."
