name: Script Tests

# Convention-based auto-discovery (KTD6 / R7): any plugin that ships the standard
# tests/ entrypoint is discovered automatically. Adding a new plugin that follows
# the layout needs NO change to this workflow.
#
# v0.5.0 (U18): the suite runs on Pester 5 (.ps1) + vendored shUnit2 (.sh).
#   - test-windows: ONE orchestrator (Invoke-ScriptTests.ps1, Windows PowerShell 5.1)
#     runs .ps1 via Pester and .sh via shUnit2 (git-bash present on windows runners).
#   - test-ubuntu: TWO orchestrators — the bash orchestrator runs the .sh suite via the
#     vendored shUnit2, and a pwsh step runs the PowerShell orchestrator for the .ps1 suite
#     (with -SkipPreflight, since the lint pre-flight hardcodes Windows powershell.exe). The
#     PS orchestrator does NOT resolve bash on non-Windows, so .sh never double-runs.
#   Framework missing (Pester 5 absent / vendored shUnit2 absent) = the job FAILs (R20);
#   only Unix x Windows-only-tool cases self-SKIP.
# `push` matters as much as `pull_request`, and its absence was not a small gap: with only the
# pull_request trigger, a long-lived branch that has not opened a PR yet gets ZERO CI runs, so the
# ubuntu half of the matrix and the repo-level verify-core-identical job never execute at all. That
# is exactly what happened on feat/turbo-plugin -- hundreds of commits, not one CI run, and a
# shared-copy invariant stayed broken the whole time because the only thing that checks it had
# never been given a chance to run. Local per-plugin orchestrators cover Windows; only CI covers
# Linux. Run on every push so the feedback arrives while the change is fresh, not at merge time.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push and its pull_request both trigger this workflow, and a branch under active development
# gets many pushes in a row. Only the newest commit's result is interesting, so supersede the
# older runs instead of paying for all of them. The default branch is excluded from cancellation
# so a merge to main always gets a complete recorded result.
concurrency:
  group: script-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # ── discover ────────────────────────────────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Discover plugins with a standard test entrypoint
        id: set
        shell: bash
        run: |
          set -euo pipefail
          plugins=()
          for dir in plugins/*/tests/; do
            [ -d "$dir" ] || continue
            plugin="${dir%/tests/}"
            if [ -f "${dir}Invoke-ScriptTests.ps1" ] || [ -f "${dir}invoke-script-tests.sh" ]; then
              plugins+=("$plugin")
            fi
          done
          json='{"plugin":['
          first=1
          for p in "${plugins[@]+"${plugins[@]}"}"; do
            if [ $first -eq 1 ]; then first=0; else json="${json},"; fi
            json="${json}\"${p}\""
          done
          json="${json}]}"
          echo "Discovered ${#plugins[@]} plugin(s): ${plugins[*]+"${plugins[*]}"}"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "count=${#plugins[@]}" >> "$GITHUB_OUTPUT"

  # ── test-windows ────────────────────────────────────────────────────────────
  # Windows PowerShell 5.1 (powershell.exe) runs the ONE orchestrator, which covers
  # BOTH .ps1 (Pester 5) and .sh (vendored shUnit2 via git-bash). Pester 5 is installed
  # side-by-side with the WinPS-builtin 3.4; shUnit2 is vendored (no install).
  test-windows:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Subversion
        shell: pwsh
        run: choco install svn --no-progress -y
        continue-on-error: true

      # choco updates the machine PATH, but a step's environment is captured when the step starts,
      # so later steps in the SAME job never saw svn. The effect was quiet rather than loud: the
      # svn-gated cases all self-SKIPped and the job still went green-ish, so 70 tests in the git-svn
      # suite were never actually exercised on Windows CI while appearing to be covered. Append the
      # install dir to GITHUB_PATH so the following steps really can run svn.
      - name: Put Subversion on PATH for later steps
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\TortoiseSVN\bin',
            'C:\Program Files\Subversion\bin',
            "$env:ProgramData\chocolatey\bin"
          )
          $found = $false
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c 'svn.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $c
              Write-Host "svn found at $c"
              $found = $true
              break
            }
          }
          if (-not $found) {
            # Not fatal: the suites self-SKIP their svn cases. Say so plainly instead of leaving
            # a silent gap that reads as coverage.
            Write-Host '::warning::svn.exe not found in the expected locations; svn-dependent cases will SKIP on this run.'
          }
        continue-on-error: true

      - name: Configure git identity (defensive)
        shell: bash
        run: |
          git config --global user.email "ci@turbo-plugin"
          git config --global user.name "turbo-plugin-ci"

      - name: Install Pester 5 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          # Pin to the Pester 5 line. `-MinimumVersion 5.0` means "at least 5.0", so it installed
          # whatever was newest -- which is now Pester 6.0.1, a different major with breaking
          # changes. CI was therefore running these tests on a framework nobody had ever run them
          # on locally (5.7.1), and the mismatch showed up as test failures that reproduce nowhere
          # else. `-MaximumVersion 5.99.99` keeps CI and local on the same major; moving to Pester 6
          # should be a deliberate change with the tests migrated, not something a release picks up.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber

      - name: Run orchestrator (Windows PowerShell 5.1; .ps1 Pester + .sh shUnit2)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ${{ matrix.plugin }}/tests/Invoke-ScriptTests.ps1

  # ── test-ubuntu ─────────────────────────────────────────────────────────────
  # Two orchestrators: bash (shUnit2 .sh) + pwsh (Pester .ps1, -SkipPreflight). The .sh
  # ps1-delegate / .NET / IIS cases self-SKIP on a runner without those tools; the SVN/git
  # cases RUN. Pester 5 is installed for pwsh; shUnit2 is vendored.
  test-ubuntu:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Configure git identity (defensive)
        run: |
          git config --global user.email "ci@turbo-plugin"
          git config --global user.name "turbo-plugin-ci"

      - name: Run bash orchestrator (shUnit2 .sh suite)
        shell: bash
        run: |
          set -o pipefail
          bash ${{ matrix.plugin }}/tests/invoke-script-tests.sh 2>&1 | tee orchestrator-output.txt

      - name: Install Pester 5 (pwsh)
        shell: pwsh
        run: |
          # Pin to the Pester 5 line. `-MinimumVersion 5.0` means "at least 5.0", so it installed
          # whatever was newest -- which is now Pester 6.0.1, a different major with breaking
          # changes. CI was therefore running these tests on a framework nobody had ever run them
          # on locally (5.7.1), and the mismatch showed up as test failures that reproduce nowhere
          # else. `-MaximumVersion 5.99.99` keeps CI and local on the same major; moving to Pester 6
          # should be a deliberate change with the tests migrated, not something a release picks up.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run PowerShell orchestrator (pwsh; .ps1 Pester only, -SkipPreflight)
        shell: pwsh
        run: |
          # -SkipPreflight: the lint pre-flight invokes Windows powershell.exe (a PS 5.1 /
          # Windows concern already covered by the windows job). The framework gate + fixture
          # handling still run, so Pester 5 absence still FAILs here. BashPath does not resolve
          # on non-Windows, so the .sh suite SKIPs in this step (owned by the bash orchestrator).
          ./${{ matrix.plugin }}/tests/Invoke-ScriptTests.ps1 -SkipPreflight

      - name: SKIP visibility (R20)
        if: ${{ always() }}
        shell: bash
        run: |
          # The .sh orchestrator's tool-incompatible cases self-SKIP via shUnit2 startSkipping.
          # Surface the count so SKIP is distinguishable from PASS in the log. Non-fatal.
          if [ -f orchestrator-output.txt ]; then
            n=$(grep -c -i "skip" orchestrator-output.txt || true)
            echo "Lines mentioning skip on ubuntu: ${n}"
          else
            echo "No bash orchestrator output captured."
          fi

  # ── verify-core-identical (cross-plugin consistency, U8 / KTD3) ──────────────
  # Repo-level invariant the per-plugin orchestrators cannot check: files copied
  # byte-identical into multiple plugins (universal Core.{ps1,sh} + shared tp-setup
  # base assets) must not drift, and marketplace.json must stay installable. Runs the
  # locale-safe bash tool (the .ps1 sibling is for local Windows use). Independent of
  # plugin discovery — always runs. This is the ONE workflow job that adding a plugin
  # may need to be aware of (R21 exception); the tool auto-discovers copies, so no edit
  # is needed per plugin.
  verify-core-identical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify cross-plugin shared-copy consistency + marketplace installability
        shell: bash
        run: bash tools/verify-core-identical.sh
