# turbo-plugin 集中設定
# 進 git，跨同事 / 跨 worktree 共享。
# 不要把 credentials 寫進這裡 — 那是 dbhub.local.toml 的工作。

schema_version = 2

# ─────────────────────────────────────────────────────────────────────────────
# [svn] — SVN bridge 行為設定
# ─────────────────────────────────────────────────────────────────────────────
[svn]
# force_bash = false  # 設為 true 強制 SVN 操作走 .sh(Git Bash)版本,用於
#                     # 中文 Windows + 含中文檔名的 SVN repo(見 /tp-setup Step 0.5 (a))

# ─────────────────────────────────────────────────────────────────────────────
# [iis] — IIS Express 啟用開關
# 預設啟用;沒有 .NET Framework Web 專案 / 不需要 IIS 的環境可設 enabled = false,
# tp-run / tp-stop / tp-cleanup-orphan-iis 等 IIS 相關 SKILL 會直接 fail-loudly 跳過。
# ─────────────────────────────────────────────────────────────────────────────
[iis]
enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# [tools] — 機器專屬工具路徑 (machine-specific,不該進 git)
# 這個 section 不該寫在 config.toml 裡 — 請改寫到 .turbo-plugin/config.local.toml
# (gitignored 的 sibling 檔案)。tp-setup Phase 3 會引導你互動填入。
#
# 範例 (寫在 config.local.toml,不要寫在這裡):
#   [tools]
#   msbuild_path      = "C:/Program Files/Microsoft Visual Studio/2022/Community/MSBuild/Current/Bin/MSBuild.exe"
#   iis_express_path  = "C:/Program Files/IIS Express/iisexpress.exe"
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# [build] — tp-build-dotnet-framework-web 用
# 全部欄位都有 default，省略整段也可。
# ─────────────────────────────────────────────────────────────────────────────
# [build]
# configuration = "Debug"           # MSBuild /p:Configuration
# platform      = "Any CPU"         # MSBuild /p:Platform
# project       = "src/Web/Web.csproj"  # 相對 worktree root；省略時自動偵測單一 .csproj

# ─────────────────────────────────────────────────────────────────────────────
# [publish] — tp-publish-dotnet-framework-web 用
# ─────────────────────────────────────────────────────────────────────────────
# [publish]
# configuration  = "Release"
# platform       = "Any CPU"
# default_pubxml = "src/Web/Properties/PublishProfiles/Production.pubxml"

# ─────────────────────────────────────────────────────────────────────────────
# [frontend] — 整段省略則發佈時不跑前端 build
# ─────────────────────────────────────────────────────────────────────────────
# [frontend]
# dir             = "src/Web/ClientApp"
# install_command = "yarn install"
# build_command   = "yarn dev-build"

# ─────────────────────────────────────────────────────────────────────────────
# [run] — tp-run-dotnet-framework-web 用
# ─────────────────────────────────────────────────────────────────────────────
# [run]
# listening_timeout_seconds = 30    # IIS Express 冷啟 + first-request JIT 場景可調高至 90
